<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TechFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Barra de navegação -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container my-4">
        <h1 class="h3 mb-3">Achados e Perdidos</h1>

        <!-- Busca -->
        <form class="d-flex mb-4">
            <input class="form-control me-2" type="search" placeholder="Buscar item...">
            <button class="btn btn-outline-primary">Buscar</button>
        </form>

        <!-- Cards dos itens -->
       <!-- Cards dos itens (um card para cada item vindo do banco) -->
        <div class="row g-3">
            <div class="col-12 col-md-6 col-lg-4" th:each="item : ${itens}">
                <div class="card h-100">
                    <div class="card-body">
                        <span class="badge bg-secondary mb-2" th:if="${item.devolvido}">Devolvido</span>
                        <h5 class="card-title" th:text="${item.titulo}">Título do item</h5>
                        <p class="card-text text-muted"
                           th:text="${item.localizacao + ' · ' + #temporals.format(item.dataOcorrencia, 'dd/MM/yyyy')}">
                            Local · 00/00/0000</p>
                        <a th:href="@{/itens/{id}(id=${item.id})}" class="btn btn-sm btn-outline-primary">Ver detalhes</a>
                    </div>
                </div>
            </div>
        </div>

        <p class="text-muted" th:if="${#lists.isEmpty(itens)}">Nenhum item cadastrado ainda.</p>
    </main>

    <div th:replace="~{fragments/layout :: rodape}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
