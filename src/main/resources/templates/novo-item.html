<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publicar item - TechFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <div class="card">
                    <div class="card-body p-4">
                        <h1 class="h4 mb-4">Publicar item</h1>

                        <form class="row g-3">

                            <!-- ===== Sobre o item ===== -->
                            <h2 class="h6 text-muted mb-0">Sobre o item</h2>

                            <div class="col-12">
                                <label class="form-label d-block">Você perdeu ou encontrou o item?</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="tipo" id="perdido"
                                        value="PERDIDO" checked>
                                    <label class="form-check-label" for="perdido">Perdi</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="tipo" id="encontrado"
                                        value="ENCONTRADO">
                                    <label class="form-check-label" for="encontrado">Encontrei</label>
                                </div>
                            </div>

                            <div class="col-12">
                                <label for="titulo" class="form-label">Título</label>
                                <input type="text" class="form-control" id="titulo"
                                    placeholder="Ex.: Garrafa térmica azul">
                            </div>

                            <div class="col-12">
                                <label for="descricao" class="form-label">Descrição</label>
                                <textarea class="form-control" id="descricao" rows="3"
                                    placeholder="Cor, marca, detalhes que ajudem a reconhecer o item"></textarea>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="categoria" class="form-label">Categoria</label>
                                <select class="form-select" id="categoria">
                                    <option selected disabled>Selecione...</option>
                                    <option>Eletrônicos</option>
                                    <option>Documentos</option>
                                    <option>Roupas e acessórios</option>
                                    <option>Material escolar</option>
                                    <option>Garrafas e utensílios</option>
                                    <option>Outros</option>
                                </select>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="local" class="form-label">Local</label>
                                <select class="form-select" id="local">
                                    <option selected disabled>Selecione...</option>
                                    <option>Biblioteca</option>
                                    <option>Cantina</option>
                                    <option>Laboratório</option>
                                    <option>Sala de aula</option>
                                    <option>Pátio</option>
                                    <option>Outro</option>
                                </select>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="data" class="form-label">Data</label>
                                <input type="date" class="form-control" id="data">
                            </div>

                            <!-- ===== Seu contato ===== -->
                            <h2 class="h6 text-muted mt-4 mb-0">Seu contato</h2>

                            <div class="col-12">
                                <label for="nome" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="nome" placeholder="Seu nome completo">
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email"
                                    placeholder="seuemail@estudante.iftm.edu.br">
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="telefone" class="form-label">Telefone</label>
                                <input type="tel" class="form-control" id="telefone" placeholder="(34) 99999-9999">
                            </div>

                            <!-- Botões -->
                            <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                                <a href="/" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Publicar</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: rodape}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
