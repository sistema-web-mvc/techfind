<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${item.id == null} ? 'Publicar item - TechFind' : 'Editar item - TechFind'">Publicar item - TechFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <div class="card">
                    <div class="card-body p-4">
                        <h1 class="h4 mb-4" th:text="${item.id == null} ? 'Publicar item' : 'Editar item'">Publicar item</h1>

                        <!-- O mesmo formulário serve para criar (POST /itens) e para editar (POST /itens/{id}) -->
                        <form class="row g-3" method="post" th:object="${item}"
                            th:action="${item.id == null} ? @{/itens} : @{/itens/{id}(id=${item.id})}">

                            <!-- ===== Sobre o item ===== -->
                            <h2 class="h6 text-muted mb-0">Sobre o item</h2>

                            <div class="col-12">
                                <label class="form-label d-block">Você perdeu ou encontrou o item?</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" id="perdido" th:field="*{tipo}" value="PERDIDO">
                                    <label class="form-check-label" for="perdido">Perdi</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" id="encontrado" th:field="*{tipo}" value="ENCONTRADO">
                                    <label class="form-check-label" for="encontrado">Encontrei</label>
                                </div>
                            </div>

                            <div class="col-12">
                                <label for="titulo" class="form-label">Título</label>
                                <input type="text" class="form-control" id="titulo" th:field="*{titulo}"
                                    placeholder="Ex.: Garrafa térmica azul">
                            </div>

                            <div class="col-12">
                                <label for="descricao" class="form-label">Descrição</label>
                                <textarea class="form-control" id="descricao" rows="3" th:field="*{descricao}"
                                    placeholder="Cor, marca, detalhes que ajudem a reconhecer o item"></textarea>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="categoria" class="form-label">Categoria</label>
                                <select class="form-select" id="categoria" th:field="*{categoria}">
                                    <option value="">Selecione...</option>
                                    <option th:each="c : ${ {'Eletrônicos', 'Documentos', 'Roupas e acessórios', 'Material escolar', 'Garrafas e utensílios', 'Outros'} }"
                                        th:value="${c}" th:text="${c}">Categoria</option>
                                </select>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="localizacao" class="form-label">Local</label>
                                <select class="form-select" id="localizacao" th:field="*{localizacao}">
                                    <option value="">Selecione...</option>
                                    <option th:each="l : ${ {'Biblioteca', 'Cantina', 'Laboratório', 'Sala de aula', 'Pátio', 'Outro'} }"
                                        th:value="${l}" th:text="${l}">Local</option>
                                </select>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="dataOcorrencia" class="form-label">Data</label>
                                <input type="date" class="form-control" id="dataOcorrencia" th:field="*{dataOcorrencia}">
                            </div>

                            <!-- ===== Seu contato ===== -->
                            <h2 class="h6 text-muted mt-4 mb-0">Seu contato</h2>

                            <div class="col-12">
                                <label for="nomeContato" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="nomeContato" th:field="*{nomeContato}"
                                    placeholder="Seu nome completo">
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="emailContato" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="emailContato" th:field="*{emailContato}"
                                    placeholder="seuemail@estudante.iftm.edu.br">
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="telefoneContato" class="form-label">Telefone</label>
                                <input type="tel" class="form-control" id="telefoneContato" th:field="*{telefoneContato}"
                                    placeholder="(34) 99999-9999">
                            </div>

                            <!-- Botões -->
                            <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                                <a th:href="${item.id == null} ? @{/} : @{/itens/{id}(id=${item.id})}"
                                    class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary"
                                    th:text="${item.id == null} ? 'Publicar' : 'Salvar alterações'">Publicar</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: rodape}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
