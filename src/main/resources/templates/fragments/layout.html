<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Fragmento: barra de navegação -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">TechFind</a>
            <div>
                <a class="btn btn-light" href="/itens/novo">Publicar item</a>
            </div>
        </div>
    </nav>
    <!-- Fragmento: mensagem de sucesso (flash). Só aparece quando existe uma mensagem -->
    <div th:fragment="mensagens" class="container mt-3" th:if="${mensagem != null}">
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensagem}">Mensagem de sucesso</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
    </div>

    <!-- Fragmento: rodapé -->
    <footer th:fragment="rodape" class="bg-light text-center text-muted py-3 mt-5">
        TechFind · Achados e Perdidos do IFTM Campus Uberlândia Centro
    </footer>

</body>

</html>
