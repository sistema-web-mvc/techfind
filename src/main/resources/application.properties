spring.application.name=techfind

# ---------------------------------------------------------------
# Banco H2 em memória chamado "techfind"
# DB_CLOSE_DELAY=-1 mantém o banco vivo enquanto a aplicação roda
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:techfind;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Liga o console do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------
# Execução automática de schema.sql e data.sql ao iniciar
# ---------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8

# ---------------------------------------------------------------
# Servidor e Thymeleaf
# ---------------------------------------------------------------
server.port=8080
spring.thymeleaf.cache=false

# Mostra no console os SQLs executados pelo JdbcTemplate
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE